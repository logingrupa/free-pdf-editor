<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edit PDF - private, in-browser PDF editor</title>
<meta name="description" content="Drop a PDF, annotate it, download it. Nothing is uploaded - the whole editor runs in your browser.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236d5efc'/%3E%3Cpath d='M9 22h14M11 18l7-7 3 3-7 7h-3z' stroke='white' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-empty="1">

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M9 22h14M11 18l7-7 3 3-7 7h-3z"/></svg>
    <span>Edit&nbsp;PDF</span>
  </div>

  <div class="file" id="fileBox">
    <span class="file-name" id="fileName" title="Click to rename" contenteditable="false"></span>
    <span class="file-meta" id="fileMeta"></span>
  </div>

  <div class="spacer"></div>

  <div class="grp" id="historyGrp">
    <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>

  <div class="grp zoomgrp">
    <button class="btn icon" id="zoomOut" title="Zoom out (Ctrl -)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="btn zoomval" id="zoomVal" title="Reset zoom">100%</button>
    <button class="btn icon" id="zoomIn" title="Zoom in (Ctrl +)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <span class="save-state" id="saveState" hidden></span>

  <button class="btn ghost" id="newBtn" title="Close and start over"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Close</span></button>
  <button class="btn primary" id="downloadBtn" disabled>
    <svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg><span>Download</span>
  </button>
</header>

<main class="shell">

  <nav class="rail" id="rail" aria-label="Tools">
    <button class="tool" data-tool="edit" title="Edit the text already on the page (E)"><svg viewBox="0 0 24 24"><path d="M4 6h13M4 11h8M4 16h5"/><path d="M14.5 19.5l5.5-5.5 2 2-5.5 5.5H14.5z"/></svg></button>
    <button class="tool" data-tool="select" title="Select / move (V)"><svg viewBox="0 0 24 24"><path d="M4 3l7 17 2.2-6.8L20 11 4 3z"/></svg></button>
    <button class="tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9.5 19h5"/></svg></button>
    <button class="tool" data-tool="pen" title="Draw (P)"><svg viewBox="0 0 24 24"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4.5 1.5L5 15 16.5 3.5z"/></svg></button>
    <button class="tool" data-tool="highlight" title="Highlight (H)"><svg viewBox="0 0 24 24"><path d="M4 20h7"/><path d="M12.5 4.5l5 5-6.5 6.5H6v-5l6.5-6.5z"/></svg></button>
    <button class="tool" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
    <button class="tool" data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
    <button class="tool" data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M11 5h8v8"/></svg></button>
    <button class="tool" data-tool="whiteout" title="White-out / redact (W)"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="1.5" class="solid"/></svg></button>
    <button class="tool" data-tool="image" title="Place image or signature (I)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5L6 21"/></svg></button>
  </nav>

  <aside class="pages" id="pagesPanel" aria-label="Pages">
    <div class="pages-head"><span>Pages</span><button class="btn icon sm" id="pagesToggle" title="Hide page list"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
    <div class="thumbs" id="thumbs"></div>
  </aside>

  <section class="stage" id="stage">
    <div class="drop" id="drop">
      <div class="drop-inner">
        <div class="drop-icon"><svg viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
        <h1>Drop a PDF here</h1>
        <p>Annotate it, then download. The file never leaves this device - no upload, no server, no account.</p>
        <button class="btn primary lg" id="pickBtn">Choose PDF</button>
        <p class="hint">Work is auto-saved in this browser, so a refresh will not lose it.</p>
      </div>
    </div>
    <div class="viewport" id="viewport"></div>
  </section>

  <aside class="props" id="props" aria-label="Properties"></aside>
</main>

<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden multiple>
<input type="file" id="imgInput" accept="image/png,image/jpeg" hidden>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden><div class="spin"></div><span id="busyText">Working...</span></div>

<script src="vendor/pdf.min.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
