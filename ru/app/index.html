<header class="topbar">
  <a class="brand" href="../" data-i18n-title="app.backHome" title="Вернуться на главную страницу Edit PDF">
    <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M9 22h14M11 18l7-7 3 3-7 7h-3z"/></svg>
    <span>Edit&nbsp;PDF</span>
  </a>

  <div class="file" id="fileBox">
    <span class="file-name" id="fileName" data-i18n-title="app.rename" title="Нажмите, чтобы переименовать" contenteditable="false"></span>
    <span class="file-meta" id="fileMeta"></span>
  </div>

  <div class="spacer"></div>

  <div class="grp" id="historyGrp">
    <button class="btn icon" id="undoBtn" data-i18n-title="app.undo" title="Отменить (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="btn icon" id="redoBtn" data-i18n-title="app.redo" title="Вернуть (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>

  <div class="grp zoomgrp">
    <button class="btn icon" id="zoomOut" data-i18n-title="app.zoomOut" title="Уменьшить (Ctrl -)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="btn zoomval" id="zoomVal" data-i18n-title="app.zoomReset" title="Сбросить масштаб">100%</button>
    <button class="btn icon" id="zoomIn" data-i18n-title="app.zoomIn" title="Увеличить (Ctrl +)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <span class="save-state" id="saveState" hidden></span>

  <nav class="lang" data-i18n-label="nav.language" aria-label="Язык">
    <a href="../../app/" hreflang="en-GB" lang="en-GB">EN</a>
    <a href="../../lv/app/" hreflang="lv" lang="lv">LV</a>

  </nav>

  <button class="btn icon theme-toggle" type="button" data-theme-toggle data-i18n-label="theme.toggle" aria-label="Переключить тему">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>

  </button>

  <button class="btn ghost" id="newBtn" data-i18n-title="app.closeTitle" title="Закрыть и начать заново"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-i18n="app.close">Закрыть</span></button>
  <button class="btn primary" id="downloadBtn" disabled>
    <svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg><span data-i18n="app.download">Скачать</span>
  </button>
</header>

<main class="shell">

  <nav class="rail" id="rail" data-i18n-label="app.tools" aria-label="Инструменты">
    <button class="tool" data-tool="edit" data-i18n-title="tool.edit" title="Изменить текст, который уже есть на странице (E)"><svg viewBox="0 0 24 24"><path d="M4 6h13M4 11h8M4 16h5"/><path d="M14.5 19.5l5.5-5.5 2 2-5.5 5.5H14.5z"/></svg></button>
    <button class="tool" data-tool="select" data-i18n-title="tool.select" title="Выделить и переместить (V)"><svg viewBox="0 0 24 24"><path d="M4 3l7 17 2.2-6.8L20 11 4 3z"/></svg></button>
    <button class="tool" data-tool="text" data-i18n-title="tool.text" title="Текст (T)"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9.5 19h5"/></svg></button>
    <button class="tool" data-tool="pen" data-i18n-title="tool.pen" title="Рисовать (P)"><svg viewBox="0 0 24 24"><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4.5 1.5L5 15 16.5 3.5z"/></svg></button>
    <button class="tool" data-tool="highlight" data-i18n-title="tool.highlight" title="Выделить цветом (H)"><svg viewBox="0 0 24 24"><path d="M4 20h7"/><path d="M12.5 4.5l5 5-6.5 6.5H6v-5l6.5-6.5z"/></svg></button>
    <button class="tool" data-tool="rect" data-i18n-title="tool.rect" title="Прямоугольник (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg></button>
    <button class="tool" data-tool="ellipse" data-i18n-title="tool.ellipse" title="Эллипс (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
    <button class="tool" data-tool="arrow" data-i18n-title="tool.arrow" title="Стрелка (A)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M11 5h8v8"/></svg></button>
    <button class="tool" data-tool="whiteout" data-i18n-title="tool.whiteout" title="Закрасить белым (W)"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="1.5" class="solid"/></svg></button>
    <button class="tool" data-tool="image" data-i18n-title="tool.image" title="Вставить изображение или подпись (I)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5L6 21"/></svg></button>
  </nav>

  <aside class="pages" id="pagesPanel" data-i18n-label="app.pages" aria-label="Страницы">
    <div class="pages-head"><span data-i18n="app.pages">Страницы</span><button class="btn icon sm" id="pagesToggle" data-i18n-title="app.pagesHide" title="Скрыть список страниц"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
    <div class="thumbs" id="thumbs"></div>
  </aside>

  <section class="stage" id="stage">
    <div class="drop" id="drop">
      <div class="drop-inner">
        <div class="drop-icon"><svg viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
        <h1 data-i18n="drop.title">Перетащите PDF сюда</h1>
        <p data-i18n="drop.body">Отредактируйте и скачайте. Файл не покидает это устройство - без загрузки на сервер, без регистрации.</p>
        <button class="btn primary lg" id="pickBtn" data-i18n="drop.pick">Выбрать PDF</button>
        <p class="hint" data-i18n="drop.hint">Работа сохраняется в этом браузере, поэтому перезагрузка страницы её не потеряет.</p>
      </div>
    </div>
    <div class="viewport" id="viewport"></div>
  </section>

  <aside class="props" id="props" data-i18n-label="app.properties" aria-label="Свойства"></aside>
</main>

<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden multiple>
<input type="file" id="imgInput" accept="image/png,image/jpeg" hidden>
<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden><div class="spin"></div><span id="busyText" data-i18n="msg.working">Обработка...</span></div>

<script src="../../vendor/pdf.min.js"></script>
